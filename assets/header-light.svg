<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Fateme Aghababaei, Front-End Developer and UI/UX Designer">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { fill: #1C1915; font-size: 50px; font-weight: 700; letter-spacing: -1.5px; }
    .role { fill: #6E675D; font-size: 16px; letter-spacing: 3px; }
    .prompt { fill: #A8741F; font-size: 17px; }
    .line { fill: #2A2622; font-size: 17px; opacity: 0; }
    .meta { fill: #8C857B; font-size: 13px; }
    .open { fill: #16A34A; font-size: 13px; }

    .l1 { animation: cycle 12s infinite 0s; }
    .l2 { animation: cycle 12s infinite 4s; }
    .l3 { animation: cycle 12s infinite 8s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    .cursor { fill: #C8943A; font-size: 17px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .pulse { transform-origin: 664px 236px; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3); opacity: 0; } }

    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-60px, 30px); } }

    .dot { animation: hop 3.2s ease-in-out infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .6s; }
    @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-6px); } }
  </style>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="898" height="278" rx="22"/></clipPath>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9B8FEC" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9B8FEC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8BF6A" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C8943A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#C8943A"/>
      <stop offset=".35" stop-color="#E8BF6A"/>
      <stop offset=".7" stop-color="#9B8FEC"/>
      <stop offset="1" stop-color="#4ADE80"/>
      <animate attributeName="x1" values="0;-1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C1915" fill-opacity=".07"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="#FBF8F3"/>
    <rect width="900" height="280" fill="url(#grid)"/>
    <circle class="orb" cx="760" cy="60" r="220" fill="url(#g1)"/>
    <circle class="orb2" cx="860" cy="250" r="180" fill="url(#g2)"/>
  </g>
  <rect x="1" y="1" width="898" height="278" rx="22" fill="none" stroke="#E7E0D5" stroke-width="1.5"/>

  <!-- accent dots -->
  <g transform="translate(56 52)">
    <circle class="dot"    cx="0"  cy="0" r="5" fill="#C8943A"/>
    <circle class="dot d2" cx="18" cy="0" r="5" fill="#E8BF6A"/>
    <circle class="dot d3" cx="36" cy="0" r="5" fill="#9B8FEC"/>
    <circle class="dot d4" cx="54" cy="0" r="5" fill="#4ADE80"/>
  </g>

  <text class="sans name" x="52" y="122">Fateme Aghababaei</text>
  <text class="mono role" x="54" y="154">FRONT-END DEVELOPER · UI/UX DESIGNER</text>

  <rect x="54" y="174" width="300" height="2" rx="1" fill="url(#rule)"/>

  <text class="mono prompt" x="54" y="214">~/ $</text>
  <g>
    <text class="mono line l1" x="104" y="214">designing interfaces in Figma<tspan class="cursor" dx="6">▍</tspan></text>
    <text class="mono line l2" x="104" y="214">building them with Vue + TypeScript<tspan class="cursor" dx="6">▍</tspan></text>
    <text class="mono line l3" x="104" y="214">shipping components for design systems<tspan class="cursor" dx="6">▍</tspan></text>
  </g>

  <text class="mono meta" x="54" y="241">Isfahan, Iran</text>
  <circle class="pulse" cx="664" cy="236" r="4" fill="#22C55E"/>
  <circle cx="664" cy="236" r="4" fill="#22C55E"/>
  <text class="mono open" x="676" y="241">open to freelance</text>
</svg>
