<svg xmlns="http://www.w3.org/2000/svg" width="440" height="232" viewBox="0 0 440 232" role="img" aria-label="Konj — a Persian-first new tab extension with Hafez, a Hijri calendar and movable widgets. Vue, TypeScript, i18n, Vite.">
<title>Konj — a Persian-first new tab extension with Hafez, a Hijri calendar and movable widgets. Vue, TypeScript, i18n, Vite.</title>
<style>
.sans{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.ink{fill:#23201C} .mut{fill:#6E675E} .des{fill:#6D5CE0} .cod{fill:#A66F12} .liv{fill:#16A34A}
.card{fill:#FFFFFF;stroke:#E4DED5} .soft{fill:#F6F3EE} .rule{stroke:#E4DED5} .grid{fill:#23201C;fill-opacity:.07}
.desS{stroke:#6D5CE0} .codS{stroke:#A66F12} .mutS{stroke:#B9B1A6} .desF{fill:#6D5CE0} .codF{fill:#A66F12}
.desT{fill:#6D5CE0;fill-opacity:.10} .codT{fill:#A66F12;fill-opacity:.10}
@media (prefers-color-scheme: dark){
 .ink{fill:#EDE6DA} .mut{fill:#9A9288} .des{fill:#A89BF2} .cod{fill:#D9A54A} .liv{fill:#4ADE80}
 .card{fill:#1F1C19;stroke:#36322D} .soft{fill:#2A2622} .rule{stroke:#36322D} .grid{fill:#EDE6DA;fill-opacity:.06}
 .desS{stroke:#A89BF2} .codS{stroke:#D9A54A} .mutS{stroke:#5A544C} .desF{fill:#A89BF2} .codF{fill:#D9A54A}
 .desT{fill:#A89BF2;fill-opacity:.14} .codT{fill:#D9A54A;fill-opacity:.14}
}
.nudge{animation:nudge 2.8s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:translate(0,0)}75%{transform:translate(3px,-3px)}}</style>
<rect x="0.75" y="0.75" width="438.5" height="230.5" rx="18" class="card" stroke-width="1.5"/>
<text x="28" y="40" class="mono des" font-size="11" letter-spacing="1.5">BROWSER EXTENSION</text>
<g transform="translate(28,56)">
  <rect x="0" y="0" width="54" height="40" rx="8" class="desT"/><rect x="10" y="12" width="26" height="5" rx="2.5" class="desF"/><rect x="10" y="23" width="18" height="4" rx="2" class="desF" opacity=".5"/>
  <rect x="62" y="0" width="40" height="40" rx="8" class="soft"/><circle cx="82" cy="20" r="10" fill="none" class="mutS" stroke-width="1.5"/><line x1="82" y1="20" x2="82" y2="13" class="mutS" stroke-width="1.5"/><line x1="82" y1="20" x2="87" y2="22" class="mutS" stroke-width="1.5"/>
  <rect x="110" y="0" width="70" height="40" rx="8" class="soft"/>  <rect x="120" y="12" width="48" height="4" rx="2" class="codF" opacity=".7"/><rect x="120" y="22" width="34" height="4" rx="2" class="codF" opacity=".4"/>
</g>
<text x="28" y="132" class="sans ink" font-size="26" font-weight="700" letter-spacing="-.7">Konj</text>
<text x="28" y="160" class="sans mut" font-size="13.5">a persian-first new tab with hafez,</text>
<text x="28" y="179" class="sans mut" font-size="13.5">a hijri calendar &amp; movable widgets.</text>
<text x="28" y="210" class="mono cod" font-size="11.5" letter-spacing=".5">vue  ·  ts  ·  i18n  ·  vite</text>
<g class="nudge"><text x="414" y="44" class="sans mut" font-size="19" text-anchor="end">↗</text></g>

</svg>
