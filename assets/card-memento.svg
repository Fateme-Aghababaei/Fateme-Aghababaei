<rect x="92" y="138" width="62" height="26" rx="13" class="soft"/><text x="123" y="155" class="sans mut" font-size="11.5" text-anchor="middle">good</text><rect x="162" y="138" width="62" height="26" rx="13" class="desF"/><text x="193" y="155" class="sans" font-size="11.5" fill="#fff" font-weight="600" text-anchor="middle">easy</text></g>
  <g class="slot sF"><rect x="0" y="22" width="262" height="160" rx="14" class="card" stroke-width="1.5"/><g class="w w0"><text x="22" y="54" class="mono mut" font-size="10.5" letter-spacing="1.2">ADJ · C1</text>
