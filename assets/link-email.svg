<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 40" width="103" height="40" role="img" aria-label="email">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .in { animation: in .6s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .arrow { animation: nudge 2.8s ease-in-out infinite; }
    @keyframes nudge { 0%,60%,100% { transform: translate(0,0); } 75% { transform: translate(2px,-2px); } }
  </style>
  <rect x="2" y="2" width="99.1" height="36" rx="18.0" fill="#24211D" stroke="#3B3631" stroke-width="1.5"/>
  <circle cx="20" cy="20.0" r="4" fill="#4ADE80"/>
  <text class="mono" x="32" y="24.5" font-size="13" fill="#E6DFD4">email</text>
  <text class="mono arrow" x="77.1" y="24.5" font-size="13" fill="#8C857B">↗</text>
</svg>
