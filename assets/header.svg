<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Fateme Aghababaei — front-end developer and UI/UX designer in Isfahan, Iran. Draws interfaces in Figma, builds them in Vue and TypeScript. Open to freelance.">
<title>Fateme Aghababaei — front-end developer and UI/UX designer in Isfahan, Iran. Draws interfaces in Figma, builds them in Vue and TypeScript. Open to freelance.</title>
<style>
.sans{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.ink{fill:#23201C} .mut{fill:#6E675E} .des{fill:#6D5CE0} .cod{fill:#A66F12} .liv{fill:#16A34A}
.card{fill:#FFFFFF;stroke:#E4DED5} .soft{fill:#F6F3EE} .rule{stroke:#E4DED5} .grid{fill:#23201C;fill-opacity:.07}
.desS{stroke:#6D5CE0} .codS{stroke:#A66F12} .mutS{stroke:#B9B1A6} .desF{fill:#6D5CE0} .codF{fill:#A66F12}
.desT{fill:#6D5CE0;fill-opacity:.10} .codT{fill:#A66F12;fill-opacity:.10}
@media (prefers-color-scheme: dark){
 .ink{fill:#EDE6DA} .mut{fill:#9A9288} .des{fill:#A89BF2} .cod{fill:#D9A54A} .liv{fill:#4ADE80}
 .card{fill:#1F1C19;stroke:#36322D} .soft{fill:#2A2622} .rule{stroke:#36322D} .grid{fill:#EDE6DA;fill-opacity:.06}
 .desS{stroke:#A89BF2} .codS{stroke:#D9A54A} .mutS{stroke:#5A544C} .desF{fill:#A89BF2} .codF{fill:#D9A54A}
 .desT{fill:#A89BF2;fill-opacity:.14} .codT{fill:#D9A54A;fill-opacity:.14}
}
.cursor{animation:travel 7s ease-in-out infinite}
@keyframes travel{0%,12%{transform:translate(462px,120px)}45%,62%{transform:translate(790px,92px)}95%,100%{transform:translate(462px,120px)}}</style>

<defs><pattern id="dg" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" class="grid"/></pattern></defs>
<rect width="900" height="310" fill="url(#dg)"/>

<!-- frame label, figma style -->
<text x="2" y="44" class="sans des" font-size="12.5" font-weight="600"># hero.frame</text>
<rect x="2" y="58" width="486" height="78" fill="none" class="desS" stroke-width="1.5"/>
<rect x="-2" y="54" width="8" height="8" class="card desS" stroke-width="1.5" rx="1"/><rect x="484" y="54" width="8" height="8" class="card desS" stroke-width="1.5" rx="1"/><rect x="-2" y="132" width="8" height="8" class="card desS" stroke-width="1.5" rx="1"/><rect x="484" y="132" width="8" height="8" class="card desS" stroke-width="1.5" rx="1"/>
<text x="18" y="114" class="sans ink" font-size="48" font-weight="700" letter-spacing="-1.6">Fateme Aghababaei</text>
<!-- dimension badge -->
<rect x="95.0" y="148" width="300" height="24" rx="5" class="desF"/>
<text x="245.0" y="164" class="mono" font-size="11.5" text-anchor="middle" fill="#fff" letter-spacing=".5">front-end developer × ui/ux designer</text>

<text x="2" y="222" class="sans ink" font-size="17">I draw interfaces in <tspan class="des" font-weight="600">figma</tspan>, then build them in <tspan class="cod" font-weight="600">vue + typescript</tspan>.</text>
<text x="2" y="248" class="sans mut" font-size="14.5">by day: a zero trust design system at <tspan class="ink" font-weight="600">payampardaz</tspan>.</text>

<!-- code panel -->
<rect x="540" y="36" width="358" height="214" rx="16" class="card" stroke-width="1.5"/>
<rect x="556" y="52" width="84" height="26" rx="7" class="codT"/>
<text x="598" y="69" class="mono cod" font-size="11.5" text-anchor="middle">Hero.vue</text>
<line x1="540" y1="92" x2="898" y2="92" class="rule" stroke-width="1.5"/>
<text x="562" y="126" class="mono mut" font-size="11" text-anchor="start" opacity=".55">1</text><text x="584" y="126" class="mono" font-size="13.5"><tspan class="mut">&lt;</tspan><tspan class="cod">template</tspan><tspan class="mut">&gt;</tspan></text><text x="562" y="151" class="mono mut" font-size="11" text-anchor="start" opacity=".55">2</text><text x="584" y="151" class="mono" font-size="13.5"><tspan class="mut">  &lt;</tspan><tspan class="ink">Design</tspan><tspan class="mut"> tool=</tspan><tspan class="des">"figma"</tspan><tspan class="mut"> /&gt;</tspan></text><text x="562" y="176" class="mono mut" font-size="11" text-anchor="start" opacity=".55">3</text><text x="584" y="176" class="mono" font-size="13.5"><tspan class="mut">  &lt;</tspan><tspan class="ink">Build</tspan><tspan class="mut"> with=</tspan><tspan class="cod">"vue + ts"</tspan><tspan class="mut"> /&gt;</tspan></text><text x="562" y="201" class="mono mut" font-size="11" text-anchor="start" opacity=".55">4</text><text x="584" y="201" class="mono" font-size="13.5"><tspan class="mut">  &lt;</tspan><tspan class="ink">Ship</tspan><tspan class="mut"> to=</tspan><tspan class="liv">"design-system"</tspan><tspan class="mut"> /&gt;</tspan></text><text x="562" y="226" class="mono mut" font-size="11" text-anchor="start" opacity=".55">5</text><text x="584" y="226" class="mono" font-size="13.5"><tspan class="mut">&lt;/</tspan><tspan class="cod">template</tspan><tspan class="mut">&gt;</tspan></text>

<!-- multiplayer cursor travelling from design to code -->
<g class="cursor">
  <path d="M0 0 L0 17 L4.6 12.6 L8 20 L11 18.6 L7.7 11.4 L13.6 11.4 Z" class="desF" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="12" y="18" width="58" height="20" rx="10" class="desF"/>
  <text x="41" y="32" class="sans" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">fateme</text>
</g>

<!-- status -->
<line x1="0" y1="280" x2="900" y2="280" class="rule" stroke-width="1.5"/>
<circle cx="6" cy="302" r="4.5" class="liv"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="18" y="306" class="mono liv" font-size="12">open to freelance</text>
<text x="900" y="306" class="mono mut" font-size="12" text-anchor="end">isfahan, iran</text>

</svg>
