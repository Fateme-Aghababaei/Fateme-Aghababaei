<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="I draw interfaces in Figma, then build them in Vue and TypeScript. By day: dashboards and a design system for a Zero Trust platform at PayamPardaz.">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .in { animation: in .6s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .hl { animation: grow 1s .3s cubic-bezier(.2,.7,.2,1) backwards; transform-box: fill-box; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } }
  </style>
  <text class="sans in" x="6" y="42" font-size="24" font-weight="500" letter-spacing="-.4" fill="#E6DFD4">hey! i draw interfaces in <tspan fill="#9B8FEC" font-weight="700">figma</tspan>, then build them in <tspan fill="#C8943A" font-weight="700">vue + typescript</tspan>.</text>
  <text class="sans in" x="6" y="80" font-size="17" fill="#B3ACA1" style="animation-delay:.2s">by day: dashboards &amp; a design system for a zero trust platform at <tspan fill="#E6DFD4" font-weight="600">payampardaz</tspan>.</text>
</svg>
