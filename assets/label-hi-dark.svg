<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="img" aria-label="say hi">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .in { animation: in .6s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .line { stroke-dasharray: 900; animation: draw 1.4s .2s ease-out backwards; }
